spring.application.name=minibank
server.port=${PORT:8080}

# Database - defaults point at a local PostgreSQL; production values come from environment variables
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/minibank}
spring.datasource.username=${DB_USERNAME:${USER:postgres}}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

# Schema is owned by Flyway migrations; Hibernate only checks that the entities match it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health

# Leave JWT_SECRET empty locally to use a random key per run. Set it (32+ chars) in production.
app.jwt.secret=${JWT_SECRET:}
app.jwt.ttl=2h
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}
app.demo.enabled=${DEMO_ENABLED:true}
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}
