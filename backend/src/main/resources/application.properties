spring.application.name=minibank
server.port=${PORT:8080}

# Database - defaults point at a local PostgreSQL; production values come from environment variables
spring.datasource.url=${DB_URL:jdbc:postgresql://localhost:5432/minibank}
spring.datasource.username=${DB_USERNAME:${USER:postgres}}
spring.datasource.password=${DB_PASSWORD:}
spring.datasource.hikari.maximum-pool-size=${DB_POOL_SIZE:5}

# Schema is owned by Flyway migrations; Hibernate only checks that the entities match it
spring.jpa.hibernate.ddl-auto=validate
spring.jpa.open-in-view=false

management.endpoints.web.exposure.include=health

# Leave JWT_SECRET empty locally to use a random key per run. Set it (32+ chars) in production.
app.jwt.secret=${JWT_SECRET:}
app.jwt.ttl=2h
app.cors.allowed-origins=${CORS_ORIGINS:http://localhost:5173}
app.demo.enabled=${DEMO_ENABLED:true}
app.admin.email=${ADMIN_EMAIL:}
app.admin.password=${ADMIN_PASSWORD:}

# MCP server: banking tools for AI assistants at /mcp (requires the same JWT as the REST API).
# Stateless: every request carries its own token, so no server-side session to track or expire.
spring.ai.mcp.server.name=mini-bank
spring.ai.mcp.server.version=1.0.0
spring.ai.mcp.server.protocol=STATELESS
spring.ai.mcp.server.instructions=Banking tools for a signed-in Mini Bank customer. Start with list_accounts. Moving money takes two steps: prepare_transfer returns a preview and a code, and confirm_transfer sends it. Always show the preview and wait for the customer's explicit yes before confirming.
# Only tools are offered; resources, prompts and completions are not used.
spring.ai.mcp.server.capabilities.resource=false
spring.ai.mcp.server.capabilities.prompt=false
spring.ai.mcp.server.capabilities.completion=false
